<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order Summary Component</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style/style.css">
</head>
<body>
  <main class="card">
    <img class="card__hero" src="../assets/illustration-hero.svg" alt="Illustration of a person dancing with headphones and a phone">

    <div class="card__body">
      <h1 class="card__title">Order Summary</h1>
      <p class="card__text">
        You can now listen to millions of songs, audiobooks, and podcasts on any device anywhere you like!
      </p>

      <div class="plan">
        <img class="plan__icon" src="../assets/icon-music.svg" alt="" width="48" height="48">
        <div class="plan__info">
          <h2 class="plan__name">Annual Plan</h2>
          <p class="plan__price">$59.99/year</p>
        </div>
        <a class="plan__change" href="#">Change</a>
      </div>

      <div class="actions">
        <button class="btn btn--primary" type="button">Proceed to Payment</button>
        <button class="btn btn--cancel" type="button">Cancel Order</button>
      </div>
    </div>
  </main>
</body>
</html>
